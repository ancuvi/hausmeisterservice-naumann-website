[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# /index.html ist dieselbe Seite wie / – auf die kanonische URL umleiten
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Sicherheits-Header für alle Antworten. Die Seite lädt nichts von Dritten;
# 'unsafe-inline' ist nur wegen der Inline-Styles und der Inline-Skripte nötig.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# Gehashte Dateien (Bilder, Schriften, CSS, JS) ändern bei jeder Änderung
# ihren Namen und dürfen ein Jahr lang unverändert gecacht werden.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Nicht gehashte Bilder und Icons: eine Woche
[[headers]]
  for = "/bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
